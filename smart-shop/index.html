<!doctype html>
<html lang="en">
  <head>

    <style>
      #landscape-blocker { display: none; }
      @media screen and (max-width: 1199px) and (orientation: landscape) and (hover: none) and (pointer: coarse) {

      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:16px;transform:rotate(90deg);"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
      <h2 style="font-size:20px;font-weight:bold;margin-bottom:8px;font-family:sans-serif;">Please Rotate Your Device</h2>
      <p style="color:#9ca3af;font-size:14px;font-family:sans-serif;margin:0;max-width:300px;">This smart experience is designed exclusively for portrait mode.</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
